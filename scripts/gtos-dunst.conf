[global]
    monitor = 0
    follow = none
    geometry = "0x0-0-0"
    indicate_hidden = no
    shrink = yes
    transparency = 100
    notification_height = 0
    separator_height = 0
    padding = 0
    horizontal_padding = 0
    frame_width = 0
    frame_color = "#00000000"
    sort = no
    idle_threshold = 0
    font = DejaVu Sans 1
    line_height = 0
    markup = none
    format = ""
    alignment = left
    show_age_threshold = -1
    word_wrap = no
    ellipsize = end
    ignore_newline = yes
    stack_duplicates = true
    hide_duplicate_count = yes
    show_indicators = no
    icon_position = off
    max_icon_size = 0
    sticky_history = no
    history_length = 0
    dmenu =
    browser =
    always_run_script = true
    title = GTOSNotify
    class = GTOSNotify
    startup_notification = false
    verbosity = crit
    corner_radius = 0
    mouse_left_click = close_current
    mouse_middle_click = do_action
    mouse_right_click = close_all
    script = /usr/bin/gtos-notifyd

[urgency_low]
    background = "#00000000"
    foreground = "#00000000"
    timeout = 1

[urgency_normal]
    background = "#00000000"
    foreground = "#00000000"
    timeout = 1

[urgency_critical]
    background = "#00000000"
    foreground = "#00000000"
    timeout = 2
